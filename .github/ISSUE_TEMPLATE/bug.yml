name: Bug report
description: Something in the PC app does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do not file them here. See SECURITY.md for how to report privately.
  - type: input
    id: version
    attributes:
      label: App version
      description: The version the app shows, or the name of the file you downloaded.
      placeholder: 0.9.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the app's log, if you have them. Remove anything private first.
      render: text
