name: Feature request
description: Suggest a change or a new capability for the PC app.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. Alternatives you considered are welcome too.
    validations:
      required: true
