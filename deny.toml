# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# The app ships for 64-bit Windows only, so only that target's dependency graph is checked.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Every advisory is an error. An exception goes here with the advisory id and the reason.
ignore = []

[licenses]
# Licenses that can be combined with AGPL-3.0-only in one program. A dependency under anything
# else fails the check until it is reviewed and added here, or replaced.
allow = [
  "AGPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
