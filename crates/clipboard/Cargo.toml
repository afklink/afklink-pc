[package]
name = "afklink-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "afklink_clipboard"
path = "src/lib.rs"

[dependencies]
afklink-core = { path = "../core" }
afklink-protocol = { path = "../protocol" }

tokio = { workspace = true }
tracing = { workspace = true }

# The clipboard's listener (a message-only window, `AddClipboardFormatListener`) and its text
# (`CF_UNICODETEXT` in global memory).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
