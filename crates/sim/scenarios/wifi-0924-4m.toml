# wifi-0924 with the bottleneck the recording itself points to. The recording's probes measured
# 3170-4308 kbps, and a probe measures the bottleneck, so the relayed WiFi path carried about
# 4 Mbps rather than the 10+ the phone's radio suggests. On a 12 Mbps bottleneck (wifi-0924.toml)
# a burst paced at 1.1x the estimate never queues and str0m never cuts; here the bursts fill the
# bottleneck and the estimate collapses on them the way the recording's did.
name = "wifi-0924-4m"
duration_s = 120
seed = 1

[content]
kind = "desktop"

[[content.phases]]
kind = "scroll"
secs = 5.0
px_per_frame = 1

[[content.phases]]
kind = "scroll"
secs = 0.4
px_per_frame = 60

[[content.phases]]
kind = "scroll"
secs = 3.0
px_per_frame = 1

[[content.phases]]
kind = "typing"
secs = 4.0
cps = 6.0

[[content.phases]]
kind = "scroll"
secs = 0.3
px_per_frame = 120

[[content.phases]]
kind = "scroll"
secs = 6.0
px_per_frame = 2

[[content.phases]]
kind = "scroll"
secs = 0.5
px_per_frame = 80

[[content.phases]]
kind = "idle"
secs = 2.0

[[content.phases]]
kind = "scroll"
secs = 4.0
px_per_frame = 1

[[content.phases]]
kind = "jump"
secs = 1.2
px = 1200
every_ms = 400

[link]
rtt_ms = 136

[link.up]
kbps = 4000
queue_ms = 400

[link.down]
kbps = 20000
queue_ms = 400
