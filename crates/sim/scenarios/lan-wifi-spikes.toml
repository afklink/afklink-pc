# A recorded LAN session: Safari on a Mac on the same LAN as the PC. The
# session opened on a srflx pair through the PC's VPN (round trip 134-163 ms), where str0m's opening
# probes measured 1337 kbps, and 0.7 s later the media moved to the LAN: room for 10+ Mbps at a
# round trip of 4-10 ms, spiking by 50-130 ms every three to six seconds (the Mac's Wi-Fi). str0m
# read the spikes as overuse, cut to 0.85x of what we were sending and crept back additively; the
# encoder sat at QP 45-46 at 1080p for ~27 s, and only a probe (at 42 s) found the 10 Mbps.
#
# Here: the first 1.2 s on a 1.3 Mbps path at 70 ms one way (the VPN pair), then 30 Mbps each way
# at 4 ms (the LAN), with a 150 ms stall of +100 ms every 3-4.5 s in both directions (packets are
# not reordered, so each stall ends in a burst, as Wi-Fi's does). The simulator has no candidate
# pairs, so the move is a change of the one path and the controller is not told of it (the agent's
# path-change re-probe is not exercised here; see `QualityController::note_path_move`). Game-like
# content: a fast camera pan that never stops, with effects every other second — about 5 Mbps at
# QP 34 at 1080p60 on a clean link (calibrated on this simulator), QP 45-46 on the
# 1-1.5 Mbps the opening leaves. What to read: seconds at QP >= 44 in the first 60 s, the time
# until 1080p is coded at QP <= 32, re-anchors and their triggers, and that the probes cost no loss
# and no brake. The run-to-run spread between seeds is large (14-45 s at QP >= 44 in the first
# minute on the same code), so compare over seeds, not one run.
#
# What it showed: a "starved-encoder probe" (restart str0m with its probes allowed to 4x
# the capacity evidence whenever the encoder sat at its QP ceiling on a path the receiver called
# clean) made this scenario worse over ten seeds — 38.4 s at QP >= 44 in the first minute against
# 20.9 without it, mean QP 40.3 against 35.6, 5.8 re-anchors a run against 2.4. Its probe results
# did not stick (the next spike undid them before the budget moved), and the capacity evidence they
# left anchored later clean collapses too high. The controller has no such probe; this
# scenario is the guard against trying it again unchanged.
name = "lan-wifi-spikes"
duration_s = 90
seed = 1

[content]
kind = "desktop"

[[content.phases]]
kind = "scroll"
secs = 1.0
px_per_frame = 16

[[content.phases]]
kind = "noise"
secs = 1.0
fraction = 0.02
fps = 60.0

[link]
rtt_ms = 8

[link.up]
schedule = [[0, 1300], [1.2, 30000]]
queue_ms = 200
delay_schedule = [[0, 70], [1.2, 4], [2.0, 104], [2.15, 4], [5.5, 104], [5.65, 4], [9.0, 104], [9.15, 4], [13.5, 104], [13.65, 4], [17.0, 104], [17.15, 4], [21.0, 104], [21.15, 4], [24.5, 104], [24.65, 4], [29.0, 104], [29.15, 4], [32.0, 104], [32.15, 4], [36.5, 104], [36.65, 4], [40.0, 104], [40.15, 4], [44.0, 104], [44.15, 4], [47.5, 104], [47.65, 4], [52.0, 104], [52.15, 4], [55.0, 104], [55.15, 4], [59.5, 104], [59.65, 4], [63.0, 104], [63.15, 4], [67.0, 104], [67.15, 4], [70.5, 104], [70.65, 4], [75.0, 104], [75.15, 4], [78.0, 104], [78.15, 4], [82.5, 104], [82.65, 4], [86.0, 104], [86.15, 4]]

[link.down]
kbps = 30000
queue_ms = 200
delay_schedule = [[0, 70], [1.2, 4], [2.0, 104], [2.15, 4], [5.5, 104], [5.65, 4], [9.0, 104], [9.15, 4], [13.5, 104], [13.65, 4], [17.0, 104], [17.15, 4], [21.0, 104], [21.15, 4], [24.5, 104], [24.65, 4], [29.0, 104], [29.15, 4], [32.0, 104], [32.15, 4], [36.5, 104], [36.65, 4], [40.0, 104], [40.15, 4], [44.0, 104], [44.15, 4], [47.5, 104], [47.65, 4], [52.0, 104], [52.15, 4], [55.0, 104], [55.15, 4], [59.5, 104], [59.65, 4], [63.0, 104], [63.15, 4], [67.0, 104], [67.15, 4], [70.5, 104], [70.65, 4], [75.0, 104], [75.15, 4], [78.0, 104], [78.15, 4], [82.5, 104], [82.65, 4], [86.0, 104], [86.15, 4]]
