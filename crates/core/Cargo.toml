[package]
name = "afklink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "afklink_core"
path = "src/lib.rs"

[dependencies]
afklink-protocol = { path = "../protocol" }
afklink-transport = { path = "../transport" }

serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# For `logging`: the level -> `EnvFilter` mapping both binaries install, kept here so the desktop
# app and the CLI cannot drift on what a level means.
tracing-subscriber = { workspace = true }
qrcode = { workspace = true }
fast_image_resize = "6.1.0"
# `viewer_keys`: ECDSA P-256 (the viewers' device and recovery keys) and SHA-256. Already built for
# the transport (rcgen/dimpl under str0m) with exactly these features, so naming them here adds no
# package and no second aws-lc-sys build; without its defaults it builds no `untrusted` either (only
# the deprecated ring-style API needs it).
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

[target.'cfg(windows)'.dependencies]
# `run_state`: when Windows booted (now minus `GetTickCount64`), to tell a previous process that
# went down with the PC from one that died alone.
windows = { workspace = true, features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
# The reconnect test in `agent.rs` runs the real signaling client against a local WebSocket backend.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
