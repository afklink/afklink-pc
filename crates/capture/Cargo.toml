[package]
name = "afklink-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "afklink_capture"
path = "src/lib.rs"

[dependencies]
afklink-core = { path = "../core" }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-capture = { workspace = true }
# «Only the game window» (`src/game.rs`) adds: the capture item made for the game's window
# (`IGraphicsCaptureItemInterop`, WinRT capture types), its DWM bounds and cloaking, the thread's
# per-monitor DPI awareness, the window's own DPI awareness, its DPI and its monitor's (the crop of a
# window Windows stretches), the process snapshot that names processes without opening them, and
# `QueryFullProcessImageNameW` through a limited-information handle. `windows-capture` enables the
# WinRT ones already; they are named here because this crate uses them itself. The capture session's
# optional properties (`src/session.rs`) add `ApiInformation`, which asks Windows whether each one
# exists, and `RtlGetVersion` for the build the log names.
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
# The hand-run probes (`src/probe/`, ignored tests run by hand): WGC capture of one window through the
# raw WinRT API, so each step keeps its own result; window and process facts read without opening the
# game beyond PROCESS_QUERY_LIMITED_INFORMATION (the OS build from the registry, WerFault's command
# line through ntdll); PNG pictures of what was captured, and the JSON record. `focus_probe` adds the
# foreground calls it tries on the game's window, a hidden shell-hook window of its own (console
# window, module handle), and the session's last-input time (a read; nothing is sent). Test builds
# only; the agent does not link any of it.
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Wdk_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
png = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
